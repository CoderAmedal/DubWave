  <title id="title">DubWave icon</title>
  <desc id="desc">A blue-violet play button surrounded by flowing sound-wave contours on a deep purple rounded square.</desc>
  <defs>
    <linearGradient id="bg" x1="28" y1="20" x2="492" y2="490" gradientUnits="userSpaceOnUse">

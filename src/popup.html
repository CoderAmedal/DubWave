<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: dark; }
    body { width: 320px; margin: 0; padding: 14px 16px 16px;
           background: #0f172a; color: #e2e8f0;
           font: 13px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
    h1 { font-size: 14px; margin: 0 0 12px; color: #93c5fd; font-weight: 600; }
    label { display: block; margin: 10px 0 4px; color: #94a3b8; font-size: 12px; }
    select, input { width: 100%; box-sizing: border-box; padding: 6px 8px; border-radius: 6px;
                    border: 1px solid #1e293b; background: #111a2e; color: #e2e8f0; font-size: 13px; }
    .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
    button { flex: 1; padding: 8px 10px; border-radius: 6px; border: 1px solid #2563eb;
             background: #1d4ed8; color: #fff; cursor: pointer; font-size: 13px; }
    button.ghost { background: transparent; color: #93c5fd; }
    #status { margin-top: 10px; color: #94a3b8; font-size: 12px; min-height: 18px; }
    .hide { display: none; }
  </style>
</head>
<body>
  <h1>DubWave 设置</h1>

  <label>目标语言</label>
  <select id="targetLang">
    <option value="zh-CN">简体中文</option>
    <option value="zh-TW">繁體中文</option>
    <option value="en">English</option>
    <option value="ja">日本語</option>
  </select>

  <label>音色（Edge TTS）</label>
  <select id="voice">
    <option value="zh-CN-XiaoxiaoNeural">晓晓 · 女</option>
    <option value="zh-CN-YunxiNeural">云希 · 男</option>
    <option value="zh-CN-YunyangNeural">云扬 · 男（新闻）</option>
    <option value="zh-TW-HsiaoChenNeural">曉臻 · 女（台湾）</option>
  </select>

  <label>字幕显示</label>
  <select id="subMode">
    <option value="bilingual">双语（原文在上，译文在下）</option>
    <option value="translation">仅译文</option>
    <option value="original">仅原文</option>
    <option value="none">不显示</option>
  </select>

  <label>翻译引擎</label>
  <select id="translator">
    <option value="google">Google（免费，无需 key）</option>
    <option value="openai">OpenAI 兼容接口</option>
  </select>

  <div id="openaiBox" class="hide">
    <label>Base URL</label>
    <input id="openaiBase" placeholder="https://api.openai.com/v1">
    <label>API Key</label>
    <input id="openaiKey" type="password" placeholder="sk-...">
    <label>模型</label>
    <input id="openaiModel" placeholder="gpt-4o-mini">
  </div>

  <label>本地 TTS 服务</label>
  <input id="ttsEndpoint" placeholder="http://127.0.0.1:8758">

  <div class="row">
    <button id="save">保存</button>
    <button id="test" class="ghost">测试 TTS</button>
  </div>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
